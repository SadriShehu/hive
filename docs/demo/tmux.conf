# The demo's tmux: a quiet status line and hive's popup on prefix+a.
set -g default-terminal "tmux-256color"
set -g escape-time 0
set -g base-index 1
set -g status-style "bg=#181825,fg=#6c7086"
set -g status-left " "
set -g status-right ""
set -g window-status-format " #W "
set -g window-status-current-format " #W "
set -g window-status-current-style "bg=#313244,fg=#cdd6f4,bold"
set -g popup-border-style "fg=#6c7086"
set -g popup-border-lines rounded
bind-key a display-popup -E -w 90% -h 85% -T " hive " "hive popup"
