version: 2

project_name: hive

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/sadrishehu/hive/internal/cmd.version=v{{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  use: github-native

homebrew_casks:
  - repository:
      owner: SadriShehu
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/SadriShehu/hive
    description: One tree of all your coding-agent sessions
    dependencies:
      - formula: tmux
    caveats: |
      Run `hive install` to connect every agent found on your PATH.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-d", "com.apple.quarantine", "hive"], chdir: ".", must_succeed: false
        end
      end
